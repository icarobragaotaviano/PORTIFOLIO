<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
<defs>
  <linearGradient id="cs-bg" x1="200" y1="0" x2="1400" y2="1200" gradientUnits="userSpaceOnUse">
    <stop stop-color="#181818"/>
    <stop offset="1" stop-color="#010101"/>
  </linearGradient>
  <linearGradient id="cs-warm" x1="0" y1="0" x2="430" y2="765" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffffff"/>
    <stop offset=".4" stop-color="#f7f4ef"/>
    <stop offset="1" stop-color="#e8e2d5"/>
  </linearGradient>
  <linearGradient id="cs-bottle" x1="0" y1="0" x2="290" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#1a1a1a"/>
    <stop offset=".35" stop-color="#333333"/>
    <stop offset=".55" stop-color="#2a2a2a"/>
    <stop offset="1" stop-color="#101010"/>
  </linearGradient>
  <linearGradient id="cs-cap" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffd401"/>
    <stop offset=".4" stop-color="#ffe76b"/>
    <stop offset="1" stop-color="#f5b802"/>
  </linearGradient>
  <filter id="cs-shadow" x="-30%" y="-30%" width="170%" height="170%">
    <feDropShadow dx="24" dy="40" stdDeviation="28" flood-color="#000000" flood-opacity=".75"/>
  </filter>
</defs>
<rect width="1600" height="1200" fill="url(#cs-bg)"/>

<!-- Geometric Backdrop Arch in Solar Yellow -->
<path d="M0 920C450 780 1040 840 1600 680V1200H0Z" fill="#1c1c1c"/>
<circle cx="1280" cy="290" r="140" fill="#ffd401" opacity=".9"/>
<path d="M1140 290H1420M1280 150V430M1180 190L1380 390M1180 390L1380 190" stroke="#010101" stroke-width="2"/>

<text x="80" y="99" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="14" letter-spacing="3">CAMPANHA // PACKAGING &amp; LIFESTYLE</text>
<text x="1520" y="1120" text-anchor="end" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="14" letter-spacing="3">CASE DEMONSTRATIVO [ 02 ]</text>

<!-- Box Package -->
<g transform="translate(460 250) rotate(-8 230 390)" filter="url(#cs-shadow)">
  <rect y="25" width="430" height="765" fill="url(#cs-warm)" rx="4"/>
  <rect y="25" width="430" height="18" fill="#ffd401"/>
  
  <text x="35" y="85" fill="#101010" font-family="'Space Mono',monospace" font-size="12" letter-spacing="2.5">SOL EM CADA DETALHE.</text>
  <text x="30" y="235" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="135" font-weight="700" letter-spacing="-8">casa</text>
  <text x="30" y="365" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="160" font-weight="700" letter-spacing="-9">sol<tspan fill="#ffd401">.</tspan></text>
  
  <!-- Graphic Sun Device -->
  <g transform="translate(215 510)">
    <circle r="92" fill="#ffd401"/>
    <circle r="56" fill="#f7f4ef"/>
    <path d="M0-110V110M-110 0H110M-78-78L78 78M-78 78L78-78" stroke="#010101" stroke-width="6"/>
    <circle r="22" fill="#ffd401"/>
  </g>
  
  <path d="M35 660H395" stroke="#3a3a3a"/>
  <text x="35" y="692" fill="#101010" font-family="'Space Grotesk',sans-serif" font-size="13" font-weight="600" letter-spacing="2">OBJETOS PARA HABITAR O TEMPO</text>
  <text x="35" y="730" fill="#3a3a3a" font-family="'Space Grotesk',sans-serif" font-size="17">Âmbar &amp; flor de laranjeira</text>
  <text x="35" y="760" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="10" letter-spacing="1.6">CONCEITO DE EMBALAGEM // 250 ML</text>
</g>

<!-- Bottle Object -->
<g transform="translate(930 480) rotate(8 145 270)" filter="url(#cs-shadow)">
  <path d="M65 55H225V123C225 150 290 160 290 215V493C290 529 265 548 228 548H62C23 548 0 529 0 493V215C0 160 65 150 65 123Z" fill="url(#cs-bottle)"/>
  <rect x="54" y="0" width="181" height="83" rx="14" fill="url(#cs-cap)"/>
  <rect x="16" y="226" width="258" height="251" rx="2" fill="#f7f4ef"/>
  
  <text x="34" y="305" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="68" font-weight="700" letter-spacing="-4">casa sol.</text>
  <circle cx="145" cy="370" r="30" fill="#ffd401"/>
  <path d="M145 328V412M103 370H187" stroke="#010101" stroke-width="4"/>
  <text x="145" y="445" text-anchor="middle" fill="#101010" font-family="'Space Mono',monospace" font-size="10" letter-spacing="1.5">UM CONVITE A FICAR.</text>
</g>
</svg>