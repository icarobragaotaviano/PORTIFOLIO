  <text x="30" y="461" fill="#173acf" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing=".3">QUANDO O VAZIO TAMBÉM DIZ.</text>
  <text x="30" y="503" fill="#313944" font-family="Arial,sans-serif" font-size="14"><tspan x="30" dy="0">Uma investigação visual sobre pausas, encontros</tspan><tspan x="30" dy="22">e tudo aquilo que acontece entre uma coisa e outra.</tspan><tspan x="30" dy="22">O olhar demora. A página respira. A ideia encontra</tspan><tspan x="30" dy="22">espaço para ser mais do que a primeira impressão.</tspan></text>
