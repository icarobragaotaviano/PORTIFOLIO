<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
<defs>
  <linearGradient id="el-bg" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
    <stop stop-color="#181818"/>
    <stop offset="1" stop-color="#010101"/>
  </linearGradient>
  <linearGradient id="el-left" x1="0" y1="0" x2="575" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffffff"/>
    <stop offset=".85" stop-color="#f7f4ef"/>
    <stop offset="1" stop-color="#d9d9d9"/>
  </linearGradient>
  <linearGradient id="el-right" x1="575" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#c8c8c8"/>
    <stop offset=".07" stop-color="#f7f4ef"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="el-gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff176"/>
    <stop offset=".4" stop-color="#ffd401"/>
    <stop offset="1" stop-color="#f5b802"/>
  </linearGradient>
  <filter id="el-shadow" x="-30%" y="-30%" width="170%" height="180%">
    <feDropShadow dx="22" dy="38" stdDeviation="32" flood-color="#000000" flood-opacity=".8"/>
  </filter>
  <clipPath id="el-right-clip"><rect x="575" width="575" height="825"/></clipPath>
</defs>
<rect width="1600" height="1200" fill="url(#el-bg)"/>

<text x="80" y="99" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="14" letter-spacing="3">DIREÇÃO DE ARTE // PROJETO EDITORIAL</text>
<text x="1520" y="1120" text-anchor="end" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="14" letter-spacing="3">CASE DEMONSTRATIVO [ 03 ]</text>

<!-- Open Editorial Magazine Spread -->
<g transform="translate(225 180) rotate(5 575 412)" filter="url(#el-shadow)">
  <path d="M-4 8H1155V831H-4Z" fill="#2a2a2a"/>
  <path d="M0 0H575V825H0Z" fill="url(#el-left)"/>
  <path d="M575 0H1150V825H575Z" fill="url(#el-right)"/>
  
  <!-- Left Page -->
  <text x="35" y="42" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="13" font-weight="700" letter-spacing="2">ENTRELINHAS</text>
  <text x="540" y="42" text-anchor="end" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="11" letter-spacing="1.5">VOLUME 01 // CULTURA VISUAL</text>
  <path d="M35 55H540" stroke="#ffd401" stroke-width="2"/>
  
  <text x="30" y="175" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="105" font-weight="700" letter-spacing="-6">O espaço</text>
  <text x="30" y="275" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="105" font-weight="700" letter-spacing="-6">entre as</text>
  <text x="30" y="375" fill="#f5b802" font-family="'Space Grotesk',sans-serif" font-size="105" font-weight="700" font-style="italic" letter-spacing="-6">ideias.</text>
  
  <text x="35" y="450" fill="#010101" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" letter-spacing="1">QUANDO O VAZIO TAMBÉM DIZ.</text>
  
  <text x="35" y="495" fill="#3a3a3a" font-family="'Space Grotesk',sans-serif" font-size="15" line-height="24">
    <tspan x="35" dy="0">Uma investigação visual sobre pausas, encontros</tspan>
    <tspan x="35" dy="24">e tudo aquilo que acontece entre uma coisa e outra.</tspan>
    <tspan x="35" dy="24">O olhar demora. A página respira. A ideia encontra</tspan>
    <tspan x="35" dy="24">espaço para ser mais do que a primeira impressão.</tspan>
  </text>
  
  <!-- Abstract Text Lines Grid -->
  <g stroke="#d9d9d9" stroke-width="2">
    <path d="M35 630H260M35 642H250M35 654H260M35 666H240M35 678H260M35 690H225M35 702H260M35 714H245M35 726H210"/>
    <path d="M295 630H525M295 642H510M295 654H525M295 666H515M295 678H525M295 690H495M295 702H525M295 714H505M295 726H480"/>
  </g>
  
  <path d="M35 776H540" stroke="#010101"/>
  <text x="35" y="800" fill="#010101" font-family="'Space Mono',monospace" font-size="11" letter-spacing="1">008</text>
  <text x="540" y="800" text-anchor="end" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="10" letter-spacing="1.5">ESTUDO EDITORIAL DEMONSTRATIVO</text>
  
  <!-- Right Page (Dark Poster Insert) -->
  <g clip-path="url(#el-right-clip)">
    <rect x="600" y="25" width="525" height="750" fill="#010101" rx="2"/>
    <!-- Gold Geometric Ribbon -->
    <ellipse cx="865" cy="380" rx="170" ry="285" transform="rotate(30 865 380)" fill="none" stroke="url(#el-gold)" stroke-width="85"/>
    <ellipse cx="865" cy="380" rx="170" ry="285" transform="rotate(30 865 380)" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
    
    <text x="625" y="725" fill="#f7f4ef" font-family="'Space Grotesk',sans-serif" font-size="115" font-weight="700" letter-spacing="-8">EN[TRE]</text>
    <text x="625" y="68" fill="#ffd401" font-family="'Space Mono',monospace" font-size="11" letter-spacing="2">FORMA LIVRE // COMPOSIÇÃO 01</text>
    <path d="M1080 80V125M1058 102H1102" stroke="#ffd401" stroke-width="2"/>
  </g>
  
  <text x="605" y="800" fill="#010101" font-family="'Space Mono',monospace" font-size="10" letter-spacing="1.5">EXPERIMENTOS SOBRE FORMA E SIGNIFICADO</text>
  <text x="1120" y="800" text-anchor="end" fill="#010101" font-family="'Space Mono',monospace" font-size="11" letter-spacing="1">009</text>
  <path d="M575 0V825" stroke="#3a3a3a" stroke-opacity=".3"/>
</g>
</svg>