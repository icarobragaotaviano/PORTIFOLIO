<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="m1-bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141414"/>
      <stop offset="1" stop-color="#010101"/>
    </linearGradient>
    <linearGradient id="m1-accent" x1="150" y1="100" x2="1050" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd401"/>
      <stop offset="1" stop-color="#f5b802"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#m1-bg)"/>
  <g stroke="#2a2a2a" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>
  <text x="60" y="70" fill="#8a8a8a" font-family="'Space Mono',monospace" font-size="13" letter-spacing="3">MOTION DESIGN // KEYFRAME SYSTEM [ 60 FPS ]</text>
  <text x="1140" y="70" text-anchor="end" fill="#ffd401" font-family="'Space Mono',monospace" font-size="13" letter-spacing="2">00:00:14:22</text>

  <!-- Bezier Motion Curve -->
  <path d="M120 560 C 360 560, 420 200, 660 200 C 880 200, 920 480, 1080 240" stroke="url(#m1-accent)" stroke-width="5" fill="none"/>
  <path d="M120 560 L 360 560 M 660 200 L 420 200" stroke="#ffe76b" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="360" cy="560" r="6" fill="#ffe76b"/>
  <circle cx="420" cy="200" r="6" fill="#ffe76b"/>

  <!-- Keyframe Diamonds -->
  <g transform="translate(120 560) rotate(45)">
    <rect x="-12" y="-12" width="24" height="24" fill="#ffd401" stroke="#010101" stroke-width="3"/>
  </g>
  <g transform="translate(660 200) rotate(45)">
    <rect x="-14" y="-14" width="28" height="28" fill="#ffd401" stroke="#010101" stroke-width="3"/>
  </g>
  <g transform="translate(1080 240) rotate(45)">
    <rect x="-12" y="-12" width="24" height="24" fill="#f5b802" stroke="#010101" stroke-width="3"/>
  </g>

  <!-- Kinetic Typography Echoes -->
  <text x="140" y="420" fill="#ffffff" fill-opacity="0.08" font-family="'Space Grotesk',sans-serif" font-size="140" font-weight="700" letter-spacing="-6">MOVIMENTO</text>
  <text x="165" y="405" fill="#ffffff" fill-opacity="0.18" font-family="'Space Grotesk',sans-serif" font-size="140" font-weight="700" letter-spacing="-6">MOVIMENTO</text>
  <text x="190" y="390" fill="#ffffff" font-family="'Space Grotesk',sans-serif" font-size="140" font-weight="700" letter-spacing="-6">MOVIMENTO</text>

  <!-- Timeline Track Bar -->
  <rect x="60" y="670" width="1080" height="64" rx="4" fill="#181818" stroke="#333333"/>
  <rect x="180" y="686" width="380" height="14" rx="2" fill="#ffd401"/>
  <rect x="420" y="706" width="520" height="14" rx="2" fill="#f5b802" fill-opacity="0.7"/>
  <line x1="660" y1="120" x2="660" y2="734" stroke="#ffd401" stroke-width="2"/>
  <polygon points="652,120 668,120 660,134" fill="#ffd401"/>
</svg>
